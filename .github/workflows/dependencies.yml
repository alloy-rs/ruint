# Runs `cargo update` weekly, resolving only releases older than the 7-day cooldown.

name: Dependencies

on:
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    if: github.repository == 'alloy-rs/ruint'
    permissions:
      contents: read
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/cargo-update-pr.yml@ea9a45762032b06b6c106ab1273415a3bff5cdc4 # cargo-update-pr-cooldown
