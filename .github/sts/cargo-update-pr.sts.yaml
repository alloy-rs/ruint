# Only the pinned dependency updater on main may create dependency PRs.
subject:
  - repo:alloy-rs/ruint:ref:refs/heads/main
  - repo:alloy-rs@128098468/ruint@492059643:ref:refs/heads/main

claim_pattern:
  repository_id: '492059643'
  event_name: '(schedule|workflow_dispatch)'
  workflow_ref: 'alloy-rs/ruint/\.github/workflows/dependencies\.yml@refs/heads/main'
  job_workflow_ref: 'tempoxyz/gh-actions/\.github/workflows/cargo-update-pr\.yml@ea9a45762032b06b6c106ab1273415a3bff5cdc4'

permissions:
  contents: write
  pull_requests: write
